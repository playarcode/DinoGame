<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DinoGameBaliw</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #fdfdfd; font-family: 'Courier New', monospace; }
  canvas { image-rendering: pixelated; background: #f7f7f7; border: 1px solid #e0e0e0; }
</style>
</head>
<body>
<canvas id="game" width="800" height="300"></canvas>
<script>
"use strict";

/* ================= setup ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
ctx.imageSmoothingEnabled = false;   // keep the sprite pixel-crisp when scaling

const GROUND_Y = 240;          // ground line
const DINO_X   = 60;           // dino never moves horizontally
const DINO_H   = 48;
const INK      = '#535353';

/* physics of the obstacle jump */
const GRAVITY   = 2600;
const JUMP_V    = -830;        // launch velocity (up)
const MAX_SPEED = 980;
const BASE_SPD  = 420;

const STATE = { START: 0, PLAY: 1, OVER: 2 };
let state = STATE.START, stateTime = 0;

let speed = BASE_SPD;
let score = 0, lastMilestone = 0, scoreFlash = 0;
let hi = 0;
try { hi = Number(localStorage.getItem('reverseDinoHigh') || 0) | 0; } catch (e) {}

let obstacles = [];
let clouds = [];
let spawnDist = 0, nextGap = 260;
let groundOffset = 0;
let jumpCooldown = 0, cooldownMax = 1;
let legTimer = 0;

/* ================= pixel art ================= */
const DINO_MAP = [
  "         ......oo...",
  "         ......oo...",
  "         ...........",
  "         ...........",
  "           .........",
  "      ..............",
  "     ...............",
  "    ................",
  "    ................",
  "    ................",
  "    ................",
  "    ................",
  "                ....",
  "....................",
  "          ..........",
  "           .........",
];
const CACTUS_MAP = [
  "    ..   ",
  "    ..   ",
  "..  ..  .",
  "..  ..  .",
  "..  ..  .",
  "..  .....",
  ".........",
  "    ..   ",
  "    ..   ",
  "    ..   ",
  "    ..   ",
  "    ..   ",
  "    ..   ",
];

function drawMap(map, x, y, s, color) {
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const ch = row[c];
      if (ch === '.') { ctx.fillStyle = color;      ctx.fillRect(x + c * s, y + r * s, s, s); }
      else if (ch === 'o') { ctx.fillStyle = '#fff'; ctx.fillRect(x + c * s, y + r * s, s, s); }
    }
  }
}

/* ================= dino sprites (live in the dino-model folder next to this file) ================= */
const SPRITE_KEYS = ['dino1', 'dino2', 'dino3', 'dino4', 'dino5', 'dino6', 'dino-idle', 'dino-jump'];
const SPRITES = {};
for (const k of SPRITE_KEYS) {
  const img = new Image();
  img.src = 'dino-model/' + k + '.png';
  SPRITES[k] = img;
}

/* ================= obstacles ================= */
const PATTERNS = [
  [{dx: 0,  s: 2}],
  [{dx: 0,  s: 3}],
  [{dx: 0,  s: 2}, {dx: 24, s: 2}],
  [{dx: 0,  s: 3}, {dx: 33, s: 3}],
  [{dx: 0,  s: 2}, {dx: 24, s: 2}, {dx: 48, s: 2}],
  [{dx: 0,  s: 2}, {dx: 26, s: 3}],
];

function spawnObstacles() {
  // harder patterns unlock as your score grows
  const maxIdx = Math.min(PATTERNS.length - 1, 1 + Math.floor(score / 100));
  const p = PATTERNS[(Math.random() * (maxIdx + 1)) | 0];
  for (const part of p) {
    obstacles.push({
      x: W + 40 + part.dx,
      y: GROUND_Y - 13 * part.s,   // top of cactus when standing on ground
      vy: 0,
      scale: part.s,
      w: 9 * part.s,
      h: 13 * part.s,
    });
  }
}

/* THE TWIST: pressing space makes grounded obstacles jump over the dino */
function tryJump() {
  if (jumpCooldown > 0) return;
  let jumped = false;
  for (const o of obstacles) {
    if (o.vy === 0 && o.y >= GROUND_Y - o.h) {   // still on the ground
      o.vy = JUMP_V;
      jumped = true;
    }
  }
}

/* ================= game flow ================= */
function startGame() {
  obstacles = [];
  score = 0; lastMilestone = 0; scoreFlash = 0;
  speed = BASE_SPD;
  spawnDist = 0; nextGap = 260;
  jumpCooldown = 0;
  groundOffset = 0;
  state = STATE.PLAY; stateTime = 0;
}

function gameOver() {
  state = STATE.OVER; stateTime = 0;
  const final = Math.floor(score);
  if (final > hi) { hi = final; try { localStorage.setItem('reverseDinoHigh', hi); } catch (e) {} }
}

/* ================= update ================= */
function update(dt) {
  stateTime += dt;
  if (state !== STATE.PLAY) return;

  speed = Math.min(MAX_SPEED, BASE_SPD + score * 0.55);
  score += dt * speed / 38;

  const m = Math.floor(score / 100);
  if (m > lastMilestone) { lastMilestone = m; scoreFlash = 0.9; }
  scoreFlash = Math.max(0, scoreFlash - dt);

  jumpCooldown = Math.max(0, jumpCooldown - dt);
  groundOffset += speed * dt;
  legTimer += dt * 5;   // paces the 6-frame walk cycle

  for (const c of clouds) {
    c.x -= speed * 0.25 * dt;
    if (c.x < -60) { c.x = W + Math.random() * 150; c.y = 30 + Math.random() * 110; }
  }

  spawnDist += speed * dt;
  if (spawnDist >= nextGap) {
    spawnDist = 0;
    nextGap = 320 + Math.random() * 380 + speed * 0.35;
    spawnObstacles();
  }

  for (const o of obstacles) {
    o.x -= speed * dt;
    const gt = GROUND_Y - o.h;
    if (o.y < gt || o.vy !== 0) {
      o.vy += GRAVITY * dt;
      o.y   += o.vy * dt;
      if (o.y >= gt) { o.y = gt; o.vy = 0; }
    }
  }
  obstacles = obstacles.filter(o => o.x > -110);

  // collision: dino box vs obstacle box
  const d = { x: DINO_X + 6, y: GROUND_Y - DINO_H + 4, w: 32, h: DINO_H - 6 };
  for (const o of obstacles) {
    const b = { x: o.x + 2, y: o.y + 3, w: o.w - 5, h: o.h - 5 };
    if (d.x < b.x + b.w && d.x + d.w > b.x && d.y < b.y + b.h && d.y + d.h > b.y) {
      gameOver();
      break;
    }
  }
}

/* ================= drawing ================= */
function hash1(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function drawGround() {
  ctx.fillStyle = INK;
  ctx.fillRect(0, GROUND_Y, W, 2);
  ctx.fillStyle = '#b4b4b4';
  const seg = 48, start = Math.floor(groundOffset / seg);
  for (let i = start; i <= start + W / seg + 1; i++) {
    const r = hash1(i);
    ctx.fillRect(i * seg - groundOffset + r * 24, GROUND_Y + 10 + (r > 0.5 ? 8 : 0), 8 + r * 10, 2);
  }
}

function drawCloud(c) {
  ctx.fillStyle = '#dcdcdc';
  ctx.fillRect(c.x,      c.y + 4, 34, 8);
  ctx.fillRect(c.x + 6,  c.y,     14, 8);
  ctx.fillRect(c.x + 18, c.y + 2, 12, 8);
}

/* old-school pixel dino, kept as a fallback in case the images can't load */
function drawDinoPixels(running, frame) {
  const x = DINO_X, top = GROUND_Y - DINO_H;
  drawMap(DINO_MAP, x, top, 2, INK);
  ctx.fillStyle = INK;
  const base = top + 32, l1 = x + 21, l2 = x + 31;
  if (running) {
    if (frame === 0) { ctx.fillRect(l1, base, 7, 16); ctx.fillRect(l2, base, 7, 8); }
    else             { ctx.fillRect(l1, base, 7, 8);  ctx.fillRect(l2, base, 7, 16); }
  } else {
    ctx.fillRect(l1, base, 7, 16);
    ctx.fillRect(l2, base, 7, 16);
  }
  ctx.fillRect(x + 34, top + 22, 10, 4);   // little arm
}

/* draws one of the sprite PNGs scaled to game height, feet on the ground line */
function drawDinoSprite(key) {
  const img = SPRITES[key];
  if (!img || !img.complete || !img.naturalWidth) return false;   // not loaded (or missing) yet
  const h = DINO_H;
  const w = Math.max(1, Math.round(img.naturalWidth * h / img.naturalHeight));
  ctx.drawImage(img, DINO_X, GROUND_Y - h, w, h);
  return true;
}

function drawDino(running, frame) {
  // walking: 6-frame cycle · start screen: idle pose · game over: 'jump' pose
  const key = state === STATE.OVER ? 'dino-jump'
            : running ? 'dino' + (frame + 1)
            : 'dino-idle';
  if (drawDinoSprite(key)) return;
  drawDinoPixels(running, frame);
}

function drawObstacle(o) {
  const gt = GROUND_Y - o.h, air = gt - o.y;
  if (air > 2) {   // soft shadow so you can judge where it will land
    ctx.globalAlpha = Math.max(0.08, 0.28 - air / 500);
    ctx.fillStyle = INK;
    ctx.fillRect(o.x + 2, GROUND_Y + 4, o.w - 4, 3);
    ctx.globalAlpha = 1;
  }
  drawMap(CACTUS_MAP, o.x, o.y, o.scale, INK);
}

function drawTelegraph(now) {
  // little blinking marker above the next grounded obstacle near you
  let best = null;
  for (const o of obstacles) {
    if (o.vy !== 0) continue;
    const dist = o.x - (DINO_X + DINO_H);
    if (dist > -20 && dist < 280 && (best === null || o.x < best.x)) best = o;
  }
  if (!best) return;
  ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now * 0.012);
  ctx.fillStyle = '#9a9a9a';
  const cx = best.x + best.w / 2, cy = best.y - 10;
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(cx - 6, cy + 8); ctx.lineTo(cx + 6, cy + 8);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

function draw(now) {
  ctx.fillStyle = '#f7f7f7';
  ctx.fillRect(0, 0, W, H);

  for (const c of clouds) drawCloud(c);
  drawGround();
  for (const o of obstacles) drawObstacle(o);
  drawDino(state === STATE.PLAY, Math.floor(legTimer) % 6);

  // score / highscore (top right)
  const showScore = state === STATE.PLAY ? (scoreFlash <= 0 || Math.floor(scoreFlash * 10) % 2 === 0) : true;
  if (showScore) {
  ctx.fillStyle = INK;
  ctx.font = "bold 15px 'Courier New', monospace";
  ctx.textAlign = 'right';
  const h = String(hi).padStart(5, '0');
  const s = String(Math.floor(score)).padStart(5, '0');
  ctx.fillText('HI ' + h + '   ' + s, W - 12, 30);
  ctx.textAlign = 'left';
  }

  if (state === STATE.PLAY) {
    drawTelegraph(now);
    // jump-cooldown bar
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(12, H - 18, 70, 6);
    const r = cooldownMax ? 1 - jumpCooldown / cooldownMax : 1;
    ctx.fillStyle = r >= 1 ? INK : '#a0a0a0';
    ctx.fillRect(12, H - 18, 70 * Math.max(0, Math.min(1, r)), 6);
    ctx.fillStyle = '#9a9a9a';
    ctx.font = "10px 'Courier New', monospace";
    ctx.fillText('JUMP READY', 12, H - 24);
  }

  if (state === STATE.START) {
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = "bold 18px 'Courier New', monospace";
    ctx.fillText('PRESS SPACE TO START', W / 2, 90);
    ctx.font = "12px 'Courier New', monospace";
    ctx.fillText('the dino will NOT jump.', W / 2, 116);
    ctx.fillText('YOU make the obstacles jump over IT.', W / 2, 132);
    ctx.textAlign = 'left';
  }

  if (state === STATE.OVER) {
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillText('G  A  M  E     O  V  E  R', W / 2, 100);
    if (stateTime > 0.4 && Math.floor(stateTime * 2) % 2 === 0) {
      ctx.font = "13px 'Courier New', monospace";
      ctx.fillText('PRESS SPACE TO RESTART', W / 2, 126);
    }
    ctx.textAlign = 'left';
  }
}

/* ================= input ================= */
function handleAction() {
  if (state === STATE.START) startGame();
  else if (state === STATE.OVER) { if (stateTime > 0.4) startGame(); }
  else tryJump();
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    handleAction();
  }
});
canvas.addEventListener('pointerdown', () => handleAction());

/* ================= main loop ================= */
for (let i = 0; i < 4; i++) {
  clouds.push({ x: 100 + i * 190 + Math.random() * 80, y: 30 + Math.random() * 110 });
}

let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  update(dt);
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
